<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struk Pembayaran - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9fdf9;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      background-color: #3bb54a;
    }
    .navbar .navbar-brand, .navbar .nav-link {
      color: #fff !important;
    }
    .sidebar {
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
    }
    .sidebar .nav-link {
      color: #3bb54a;
      font-weight: 500;
    }
    .sidebar .nav-link.active {
      background: #3bb54a; 
      color: #fff;
      border-radius: 10px;
    }
    /* Styling struk box */
    .struk-box {
      max-width: 400px;
      margin: auto;
      border: 1px dashed #333;
      padding: 20px;
      border-radius: 8px;
      background: #fff;
      font-family: monospace;
    }
    .struk-box h5 {
      text-align: center;
      margin-bottom: 10px;
    }
    .struk-box table {
      width: 100%;
      font-size: 13px;
    }
    .struk-box th, .struk-box td {
      padding: 4px 0;
    }
    .struk-box td:nth-child(2), 
    .struk-box td:nth-child(3) {
      text-align: right;
    }
    .struk-box .total {
      font-weight: bold;
      border-top: 1px dashed #333;
    }
    .struk-footer {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-3">
  <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
    <img src="../assets/img/logo2.png" alt="Logo Jualin" style="height:35px; margin-right:8px;">
    Jualin
  </a>
  <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="ms-auto d-flex align-items-center">
    <span id="user-name" class="text-white fw-semibold me-3"></span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar Offcanvas -->
    <div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebarMenu">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-3">
        <nav class="nav flex-column">
          <a class="nav-link" href="kasir.html">Kasir</a>
          <a class="nav-link active" href="riwayat_transaksi_kasir.html">Riwayat Transaksi</a>
          <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </nav>
      </div>
    </div>

    <!-- Sidebar (Desktop) -->
    <div class="col-md-2 d-none d-md-block sidebar p-3">
      <nav class="nav flex-column">
        <a class="nav-link" href="kasir.html">Kasir</a>
        <a class="nav-link active" href="riwayat_transaksi_kasir.html">Riwayat Transaksi</a>
        <a class="nav-link" href="#" onclick="logout()">Logout</a>
      </nav>
    </div>

    <!-- Konten -->
    <div class="col-md-10 p-4">
      <h4 class="mb-3">Struk Pembayaran</h4>
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="struk-box" id="struk-box">
            <h5>Struk Pembayaran</h5>
            <div id="info-transaksi" class="text-center small mb-2">Memuat...</div>
            <div id="struk-content"></div>
            <div class="struk-footer">
              Terima kasih telah berbelanja<br>
              <span>Barang yang sudah dibeli tidak dapat dikembalikan</span>
            </div>
          </div>
          <div class="mt-3 text-center">
            <button class="btn btn-success" onclick="downloadStruk()">Download</button>
            <button class="btn btn-secondary" onclick="window.location.href='riwayat_transaksi_kasir.html'">Kembali</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // LOGIN HANDLING + LOAD TRANSAKSI — semua dalam satu DOMContentLoaded
document.addEventListener("DOMContentLoaded", () => {
  const nama    = sessionStorage.getItem("kasir_nama");
  const id_toko = sessionStorage.getItem("kasir_id_toko"); // ✅ terdefinisi di sini

  if (!nama || !id_toko) {
    window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
    return;
  }
  document.getElementById("user-name").innerText = nama;

  // LOAD TRANSAKSI — id_toko sudah tersedia di sini
  const params = new URLSearchParams(window.location.search);
  const kode   = params.get("kode");

  if (!kode) {
    document.getElementById("info-transaksi").innerText = "Kode transaksi tidak ditemukan.";
    return;
  }

  fetch(`http://localhost/Projek_jualin_v0.1/Backend/transaksi/detail_transaksi.php?kode=${kode}&id_toko=${id_toko}`)
    .then(res => res.json())
    .then(trx => {
      const tanggal = new Date(trx.TANGGAL).toLocaleDateString("id-ID");
      const waktu   = new Date(trx.TANGGAL).toLocaleTimeString("id-ID");

      document.getElementById("info-transaksi").innerHTML =
        `Kode: ${trx.KODE_TRANSAKSI}<br>${tanggal} ${waktu}<br>Metode: ${trx.METODE}`;

      let html = "<table class='table table-sm'>";
      html += "<tr><th>Produk</th><th>Qty</th><th>Subtotal</th></tr>";
      trx.ITEMS.forEach(item => {
        html += `<tr>
          <td>${item.nama}</td>
          <td>x${item.jumlah}</td>
          <td>Rp ${parseInt(item.subtotal).toLocaleString("id-ID")}</td>
        </tr>`;
      });
      html += `<tr>
        <td colspan="2" class="total">Total</td>
        <td class="total">Rp ${parseInt(trx.TOTAL).toLocaleString("id-ID")}</td>
      </tr>`;
      html += "</table>";
      document.getElementById("struk-content").innerHTML = html;
    })
    .catch(err => {
      document.getElementById("info-transaksi").innerText = "Gagal memuat data transaksi.";
      console.error(err);
    });
});

function logout() {
  sessionStorage.removeItem("kasir_id");
  sessionStorage.removeItem("kasir_nama");
  sessionStorage.removeItem("kasir_role");
  sessionStorage.removeItem("kasir_token");
  sessionStorage.removeItem("kasir_id_toko");
  window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
}

  // DOWNLOAD STRUK JPG
function downloadStruk() {
  const struk = document.getElementById("struk-box");
  html2canvas(struk, { scale: 3 }).then(canvas => {
    const dataURL = canvas.toDataURL("image/jpeg", 0.95);
    
    // buat blob supaya tidak trigger new tab
    const byteString = atob(dataURL.split(",")[1]);
    const mimeString = dataURL.split(",")[0].split(":")[1].split(";")[0];
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
    }
    const blob = new Blob([ab], { type: mimeString });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "struk_" + new Date().getTime() + ".jpg";
    link.click();
    URL.revokeObjectURL(link.href);
  });
}

</script>
</body>
</html>
