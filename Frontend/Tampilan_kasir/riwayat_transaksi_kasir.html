<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Transaksi - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9fdf9;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      background-color: #3bb54a;
    }
    .navbar .navbar-brand, .navbar .nav-link, .navbar .btn {
      color: #fff !important;
    }
    .sidebar {
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
    }
    .sidebar .nav-link {
      color: #3bb54a;
      font-weight: 500;
    }
    .btn-green {
      background: #3bb54a;
      color: #fff;
      border-radius: 10px;
    }
    .sidebar .nav-link.active {
      background: #3bb54a;
      color: #fff;
      border-radius: 10px;
    }
    .table-responsive {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table th, .table td {
      white-space: nowrap;
    }

    /* Info bar tanggal aktif */
    .tanggal-aktif-bar {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tanggal-aktif-label {
      font-size: 13px;
      color: #2e7d32;
      font-weight: 600;
    }
    .tanggal-aktif-val {
      font-size: 14px;
      font-weight: 800;
      color: #1b5e20;
    }
    .btn-lihat-semua {
      font-size: 12px;
      color: #388e3c;
      background: none;
      border: 1px solid #a5d6a7;
      border-radius: 8px;
      padding: 4px 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-lihat-semua:hover {
      background: #c8e6c9;
    }

    @media (max-width: 768px) {
      .navbar-brand img { height: 28px; }
      h4.mb-3 { font-size: 1.2rem; }
      .btn { font-size: 0.85rem; padding: 6px 10px; }
      .table td, .table th { font-size: 0.8rem; padding: 6px; }
    }

    /* MOBILE CARD */
    #mobile-transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mobile-transaction-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 5px solid #3bb54a;
    }
    .mobile-transaction-card h6 {
      margin-bottom: 6px;
      font-weight: 600;
    }
    .mobile-transaction-card p {
      margin-bottom: 4px;
      font-size: 14px;
    }
    .mobile-transaction-card .btn {
      margin-top: 8px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-3">
  <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
    <img src="../assets/img/logo2.png" alt="Logo Jualin" style="height:35px; margin-right:8px;">
    Jualin
  </a>
  <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
    ☰
  </button>
  <div class="ms-auto d-flex align-items-center">
    <span id="user-name" class="text-white fw-semibold me-3"></span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar Offcanvas (Mobile) -->
    <div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebarMenu">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-3">
        <nav class="nav flex-column">
          <a class="nav-link" href="kasir.html">Kasir</a>
          <a class="nav-link active" href="riwayat_transaksi_kasir.html">Riwayat Transaksi</a>
          <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </nav>
      </div>
    </div>

    <!-- Sidebar (Desktop) -->
    <div class="col-md-2 d-none d-md-block sidebar p-3">
      <nav class="nav flex-column">
        <a class="nav-link" href="kasir.html">Kasir</a>
        <a class="nav-link active" href="riwayat_transaksi_kasir.html">Riwayat Transaksi</a>
        <a class="nav-link" href="#" onclick="logout()">Logout</a>
      </nav>
    </div>

    <!-- Konten -->
    <div class="col-md-10 p-4">
      <h4 class="mb-3">Riwayat Transaksi</h4>

      <!-- Filter Tanggal & Waktu -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Filter berdasarkan tanggal & waktu:</label>
        <div class="row g-2 align-items-center">
          <div class="col-6 col-md-3">
            <input type="date" id="start-date" class="form-control">
          </div>
          <div class="col-6 col-md-3">
            <input type="date" id="end-date" class="form-control">
          </div>
          <div class="col-6 col-md-2">
            <input type="time" id="start-time" class="form-control">
          </div>
          <div class="col-6 col-md-2">
            <input type="time" id="end-time" class="form-control">
          </div>
          <div class="col-12 col-md-2">
            <button class="btn btn-green w-100" onclick="filterTanggal()">Filter</button>
          </div>
        </div>
        <small class="text-muted">Gunakan "mulai tanggal & waktu" sampai "tanggal & waktu akhir".</small>
      </div>

      <!-- Info tanggal yang sedang ditampilkan -->
      <div class="tanggal-aktif-bar" id="infoBar">
        <div>
          <span class="tanggal-aktif-label">📅 Menampilkan: </span>
          <span class="tanggal-aktif-val" id="infoTanggal">—</span>
        </div>
        <button class="btn-lihat-semua" id="btnSemuaData" onclick="tampilSemuaData()" style="display:none;">
          Lihat Semua Tanggal
        </button>
      </div>

      <!-- Tabel Desktop -->
      <div class="table-responsive d-none d-md-block">
        <table class="table table-bordered table-hover">
          <thead class="table-success">
            <tr>
              <th>Kode Transaksi</th>
              <th>Tanggal</th>
              <th>Metode</th>
              <th>Total</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <tr><td colspan="5" class="text-center">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Versi Mobile Card -->
      <div id="mobile-transaction-list" class="d-md-none"></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let allData       = [];
  let isFilterActive= false;   // true jika sedang pakai filter manual

  function ensureKasirAuth() {
    const nama    = sessionStorage.getItem("kasir_nama");
    const role    = sessionStorage.getItem("kasir_role");
    const id_toko = sessionStorage.getItem("kasir_id_toko");
    if (!nama || role !== "Kasir" || !id_toko) {
      window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
      return false;
    }
    const el = document.getElementById("user-name");
    if (el) el.innerText = nama;
    return true;
  }

  function logout() {
    sessionStorage.removeItem("kasir_id");
    sessionStorage.removeItem("kasir_nama");
    sessionStorage.removeItem("kasir_role");
    sessionStorage.removeItem("kasir_token");
    window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!ensureKasirAuth()) return;
    loadTransactions();
  });

  async function loadTransactions() {
    try {
      const id_toko = sessionStorage.getItem("kasir_id_toko");
      const res  = await fetch(`http://localhost/Projek_jualin_v0.1/Backend/transaksi/lihat_transaksi.php?id_toko=${id_toko}`);
      const data = await res.json();

      // Urutkan: terbaru di atas (sort by TANGGAL DESC)
      allData = data.sort((a, b) => new Date(b.TANGGAL) - new Date(a.TANGGAL));

      // Default: tampilkan 1 hari terbaru saja
      tampilHariTerbaru();
    } catch (err) {
      console.error("Gagal ambil data transaksi:", err);
      document.getElementById("transaction-list").innerHTML =
        `<tr><td colspan="5" class="text-center text-danger">Gagal memuat data</td></tr>`;
    }
  }

  // ── Tampilkan hanya hari terbaru (default) ──
  function tampilHariTerbaru() {
    isFilterActive = false;
    document.getElementById("start-date").value = "";
    document.getElementById("end-date").value   = "";
    document.getElementById("start-time").value = "";
    document.getElementById("end-time").value   = "";

    if (!allData.length) {
      updateInfoBar("Tidak ada transaksi", false);
      renderTable([]);
      return;
    }

    // Ambil tanggal terbaru dari data (format YYYY-MM-DD)
    const tanggalTerbaru = allData[0].TANGGAL.split(" ")[0];
    const filtered = allData.filter(trx => trx.TANGGAL.split(" ")[0] === tanggalTerbaru);

    updateInfoBar("Hari ini (" + formatTanggal(tanggalTerbaru) + ") — " + filtered.length + " transaksi", false);
    renderTable(filtered);
  }

  // ── Tampilkan semua data (tombol "Lihat Semua Tanggal") ──
  function tampilSemuaData() {
    isFilterActive = false;
    updateInfoBar("Semua tanggal — " + allData.length + " transaksi", true);
    renderTable(allData);
  }

  // ── Update info bar ──
  function updateInfoBar(teks, showBtnSemua) {
    document.getElementById("infoTanggal").textContent      = teks;
    document.getElementById("btnSemuaData").style.display   = showBtnSemua ? "none" : "inline-block";
  }

  // ── Format tanggal YYYY-MM-DD → "DD Bulan YYYY" ──
  function formatTanggal(str) {
    const bulan = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
    const d = new Date(str);
    if (isNaN(d)) return str;
    return d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
  }

  // ── Filter manual ──
  function filterTanggal() {
    const startDate = document.getElementById("start-date").value;
    const endDate   = document.getElementById("end-date").value;
    const startTime = document.getElementById("start-time").value;
    const endTime   = document.getElementById("end-time").value;

    // Jika semua kosong → kembali ke hari terbaru
    if (!startDate && !endDate && !startTime && !endTime) {
      tampilHariTerbaru();
      return;
    }

    isFilterActive = true;
    const filtered = allData.filter(trx => {
      let [tgl, jam] = trx.TANGGAL.split(" ");
      if (!jam) jam = "00:00:00";
      if (startDate && tgl < startDate) return false;
      if (endDate   && tgl > endDate)   return false;
      if (startTime && tgl === startDate && jam < startTime) return false;
      if (endTime   && tgl === endDate   && jam > endTime)   return false;
      return true;
    });

    const label = startDate && endDate
      ? formatTanggal(startDate) + " — " + formatTanggal(endDate)
      : startDate ? "Mulai " + formatTanggal(startDate)
      : endDate   ? "s/d " + formatTanggal(endDate)
      : "Filter waktu";

    updateInfoBar(label + " — " + filtered.length + " transaksi", true);
    renderTable(filtered);
  }

  // ── Render tabel & mobile cards ──
  function renderTable(data) {
    const tbody      = document.getElementById("transaction-list");
    const mobileList = document.getElementById("mobile-transaction-list");

    tbody.innerHTML      = "";
    mobileList.innerHTML = "";

    if (!data.length) {
      tbody.innerHTML      = `<tr><td colspan="5" class="text-center text-muted py-3">Tidak ada transaksi</td></tr>`;
      mobileList.innerHTML = `<p class="text-center text-muted">Tidak ada transaksi</p>`;
      return;
    }

    data.forEach(trx => {
      // Desktop
      let tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${trx.KODE_TRANSAKSI}</td>
        <td>${trx.TANGGAL}</td>
        <td>${trx.METODE}</td>
        <td>Rp ${parseInt(trx.TOTAL).toLocaleString("id-ID")}</td>
        <td>
          <a href="detail_transaksi_kasir.html?kode=${trx.KODE_TRANSAKSI}"
             class="btn btn-sm btn-primary">Detail</a>
        </td>`;
      tbody.appendChild(tr);

      // Mobile
      let card = document.createElement("div");
      card.className = "mobile-transaction-card";
      card.innerHTML = `
        <h6>${trx.KODE_TRANSAKSI}</h6>
        <p><strong>Tanggal:</strong> ${trx.TANGGAL}</p>
        <p><strong>Metode:</strong> ${trx.METODE}</p>
        <p class="text-success fw-bold">Rp ${parseInt(trx.TOTAL).toLocaleString("id-ID")}</p>
        <a href="detail_transaksi_kasir.html?kode=${trx.KODE_TRANSAKSI}"
           class="btn btn-sm btn-green w-100">Lihat Detail</a>`;
      mobileList.appendChild(card);
    });
  }
</script>
</body>
</html>
