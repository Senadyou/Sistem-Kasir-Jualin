<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Transaksi - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9fdf9;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      background-color: #3bb54a; /* hijau muda */
    }
    .navbar .navbar-brand, .navbar .nav-link, .navbar .btn {
      color: #fff !important;
    }
    .sidebar {
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
    }
    .sidebar .nav-link {
      color: #3bb54a;
      font-weight: 500;
    }
    .sidebar .nav-link.active {
      background: #3bb54a; 
      color: #fff;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-3">
  <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
    <img src="../assets/img/logo2.png" alt="Logo Jualin" style="height:35px; margin-right:8px;">
    Jualin
  </a>
  <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="ms-auto d-flex align-items-center">
    <span id="user-name" class="text-white fw-semibold me-3"></span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar Offcanvas (Mobile) -->
    <div class="offcanvas offcanvas-start sidebar" tabindex="-1" id="sidebarMenu">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body p-3">
        <nav class="nav flex-column">
          <a class="nav-link" href="kasir.html">Kasir</a>
          <a class="nav-link active" href="riwayat_transaksi_kasir.html">Riwayat Transaksi</a>
          <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </nav>
      </div>
    </div>

    <!-- Sidebar (Desktop) -->
    <div class="col-md-2 d-none d-md-block sidebar p-3">
      <nav class="nav flex-column">
        <a class="nav-link" href="kasir.html">Kasir</a>
        <a class="nav-link active" href="riwayat_transaksi_kasir.html">Riwayat Transaksi</a>
        <a class="nav-link" href="#" onclick="logout()">Logout</a>
      </nav>
    </div>

    <!-- Konten -->
    <div class="col-md-10 p-4">
      <h4 class="mb-3">Detail Transaksi</h4>
      <div class="card shadow-sm">
        <div class="card-body">
          <div id="transaction-detail">Memuat data...</div>
          <div class="mt-4">
            <button class="btn btn-success" onclick="cetakStruk()">Cetak Struk</button>
            <button class="btn btn-primary" onclick="bagikan()">Bagikan</button>
            <button class="btn btn-secondary" onclick="window.location.href='riwayat_transaksi_kasir.html'">Kembali</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// LOGIN HANDLING
document.addEventListener("DOMContentLoaded", () => {
  const nama    = sessionStorage.getItem("kasir_nama");
  const id_toko = sessionStorage.getItem("kasir_id_toko");
  if (!nama || !id_toko) {
    window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
    return;
  }
  document.getElementById("user-name").innerText = nama;
});

function logout() {
  sessionStorage.removeItem("kasir_id");
  sessionStorage.removeItem("kasir_nama");
  sessionStorage.removeItem("kasir_role");
  sessionStorage.removeItem("kasir_token");
  window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
}

  // ====== DETAIL TRANSAKSI ======
  const params = new URLSearchParams(window.location.search);
const kode = params.get("kode");

fetch(`http://localhost/Projek_jualin_v0.1/Backend/transaksi/detail_transaksi.php?kode=${kode}&id_toko=${sessionStorage.getItem("kasir_id_toko")}`)
  .then(res => res.json())
  .then(trx => {
    const div = document.getElementById("transaction-detail");
    div.innerHTML = `
      <p><b>Kode Transaksi:</b> ${trx.KODE_TRANSAKSI}</p>
      <p><b>Tanggal:</b> ${trx.TANGGAL}</p>
      <p><b>Metode:</b> ${trx.METODE}</p>
      <p><b>Total:</b> Rp ${trx.TOTAL}</p>
      <h6>Daftar Item:</h6>
      <ul class="list-group">
        ${trx.ITEMS.map(it => `<li class="list-group-item d-flex justify-content-between">
          ${it.nama} (x${it.jumlah})
          <span>Rp ${it.subtotal}</span>
        </li>`).join("")}
      </ul>
    `;
  });

function cetakStruk() {
  window.location.href = "struk.html?kode=" + kode;
}

function bagikan(){
  if(navigator.share){
    navigator.share({
      title: "Transaksi " + kode,
      text: "Detail transaksi dari Jualin",
      url: window.location.href
    });
  } else {
    alert("Fitur bagikan tidak didukung di browser ini.");
  }
}

</script>
</body>
</html>
