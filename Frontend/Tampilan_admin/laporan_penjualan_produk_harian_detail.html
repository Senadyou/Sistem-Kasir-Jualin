<script>
const urlParams = new URLSearchParams(window.location.search);
const tanggal = urlParams.get("tanggal");

async function loadDetail() {
  try {
    const id_toko = sessionStorage.getItem("admin_id_toko");
    if (!id_toko) {
      window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html";
      return;
    }
    const res = await axios.get(`http://localhost/Projek_jualin_v0.1/Backend/laporan/penjualan_produk_harian_detail.php?tanggal=${tanggal}&id_toko=${id_toko}`);
    const data = res.data;

    const div = document.getElementById("detail-harian");

    if (data.length === 0) {
      div.innerHTML = `<p class="text-center text-danger">Tidak ada data pada tanggal ini</p>`;
      return;
    }

    let totalHarian = 0;

    const listProduk = data.map(row => {
      totalHarian += parseInt(row.TOTAL_PENJUALAN);
      return `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          ${row.NAMA_PRODUK} (x${row.TOTAL_TERJUAL})
          <span>Rp ${parseInt(row.TOTAL_PENJUALAN).toLocaleString("id-ID")}</span>
        </li>
      `;
    }).join("");

    div.innerHTML = `
      <p><b>Tanggal:</b> ${tanggal}</p>
      <p><b>Total Penjualan Hari Ini:</b> 
        <span class="fw-bold text-success">
          Rp ${totalHarian.toLocaleString("id-ID")}
        </span>
      </p>
      <h6>Daftar Produk Terjual:</h6>
      <ul class="list-group">
        ${listProduk}
      </ul>
    `;

  } catch (err) {
    console.error(err);
    document.getElementById("detail-harian").innerHTML =
      `<p class="text-danger text-center">Gagal memuat data</p>`;
  }
}

loadDetail();
</script>
