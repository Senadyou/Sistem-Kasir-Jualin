<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Produk - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #d4f5d1;
    }
    #sidebar {
      width: 220px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
    }
    .main-content {
      margin-left: 220px;
      padding: 20px;
    }
    .navbar-dashboard {
      background-color: #4CAF50;
      color: white;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 20px;
    }
    .navbar-dashboard h2 {
      margin: 0;
      font-weight: bold;
    }
    .btn-simpan {
      background-color: #e6d600;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      transition: 0.3s;
    }
    .btn-simpan:hover {
      background-color: rgb(179, 161, 0);
      color: #000;
    }
    @media (max-width: 768px) {
      #sidebar {
        display: none;
      }
      .main-content {
        margin-left: 0 !important;
        padding: 15px;
      }
      .navbar-dashboard {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
      .navbar-dashboard h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Desktop -->
  <div id="sidebar" class="d-none d-md-block bg-success text-white p-3">
    <h4 class="fw-bold">
      <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="32" height="32" class="me-2">Jualin
    </h4>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li><a href="produk.html"       class="nav-link text-white active">📦 Produk</a></li>
      <li><a href="user.html"         class="nav-link text-white">👤 User</a></li>
      <li><a href="laporan.html"      class="nav-link text-white">📑 Laporan</a></li>
      <li><a href="bahan_baku.html"   class="nav-link text-white">🧪 Bahan Baku</a></li>
      <li><a href="resep_produk.html" class="nav-link text-white ">🍳 Resep Produk</a></li>
      <li><a href="http://localhost/Projek_jualin_v0.1/Frontend/login.html" class="nav-link text-danger fw-bold">🚪 Logout</a></li>
    </ul>
  </div>

  <!-- Navbar Mobile -->
  <nav class="navbar bg-success d-md-none px-3 py-2">
    <button class="btn btn-light btn-sm" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">☰ Menu</button>
    <span class="text-white fw-bold ms-2">
      <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="26" height="26" class="me-1">Jualin
    </span>
  </nav>

  <!-- Offcanvas Mobile -->
  <div class="offcanvas offcanvas-start text-bg-success" id="mobileSidebar">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title"><img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="28" height="28" class="me-2">Jualin</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav nav-pills flex-column">
        <li><a href="produk.html"       class="nav-link text-white active">📦 Produk</a></li>
        <li><a href="user.html"         class="nav-link text-white">👤 User</a></li>
        <li><a href="laporan.html"      class="nav-link text-white">📑 Laporan</a></li>
        <li><a href="bahan_baku.html"   class="nav-link text-white">🧪 Bahan Baku</a></li>
        <li><a href="resep_produk.html" class="nav-link text-white ">🍳 Resep Produk</a></li>
        <li><a href="../login.html"     class="nav-link text-danger fw-bold">🚪 Logout</a></li>
      </ul>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="main-content">
    <div class="container-fluid py-4">
      <!-- HEADER -->
      <div class="navbar-dashboard d-flex justify-content-between align-items-center">
        <h2>➕ Tambah Produk</h2>
        <a href="produk.html" class="btn btn-light">Kembali</a>
      </div>

      <!-- FORM TAMBAH PRODUK -->
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <form id="produkForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="kode" class="form-label">Kode Produk</label>
              <input type="text" class="form-control" id="kode" name="KODE_PRODUK" required>
            </div>

            <div class="mb-3">
              <label for="nama" class="form-label">Nama Produk</label>
              <input type="text" class="form-control" id="nama" name="NAMA_PRODUK" required>
            </div>

            <div class="mb-3">
              <label for="harga_modal" class="form-label">Harga Modal</label>
              <input type="number" class="form-control" id="harga_modal" name="HARGA_MODAL" required>
            </div>

            <div class="mb-3">
              <label for="harga_jual" class="form-label">Harga Jual</label>
              <input type="number" class="form-control" id="harga_jual" name="HARGA_JUAL" required>
            </div>

            <div class="mb-3">
              <label for="stok" class="form-label">Stok</label>
              <input type="number" class="form-control" id="stok" name="STOK" required>
            </div>

            <div class="mb-3">
              <label for="kategori" class="form-label">Kategori</label>
              <select class="form-control" id="kategori" name="KATEGORI" required>
              <option value="Makanan">Makanan</option>
              <option value="Minuman">Minuman</option>
              <option value="Kabel">Kabel</option>
              <option value="Adaptor">Adaptor</option>
              <option value="Baterai">Baterai</option>
              <option value="Earphone">Earphone</option> 
              <option value="Anti Gores">Anti Gores</option>  
              <option value="Kartu Perdana">Kartu Perdana</option>  
            </select>


            <div class="mb-3">
              <label for="gambar" class="form-label">Gambar Produk</label>
              <input type="file" class="form-control" id="gambar" name="GAMBAR" accept="image/*">
            </div>


            <button type="submit" class="btn btn-simpan w-100">💾 Simpan Produk</button>
          </form>
        </div>
      </div>

      <!-- Alert hasil -->
      <div id="alertBox" class="mt-3"></div>
    </div>
  </div>

  <!-- Bootstrap & SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
  document.getElementById("produkForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = document.getElementById("produkForm");
    const formData = new FormData(form);

    // ✅ Ambil id_toko dari sessionStorage dan sertakan
    const id_toko = sessionStorage.getItem("admin_id_toko");
    if (!id_toko) {
      Swal.fire("Error!", "Session toko tidak ditemukan. Silakan login ulang.", "error");
      setTimeout(() => window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html", 2000);
      return;
    }
    formData.append("id_toko", id_toko);

    try {
      const res = await fetch("http://localhost/Projek_jualin_v0.1/Backend/produk/tambah_produk.php", {
        method: "POST",
        body: formData
      });

      const result = await res.json();

      if (result.status) {
        Swal.fire({
          title: 'Berhasil!',
          text: 'Produk berhasil ditambahkan.',
          icon: 'success',
          timer: 2000,
          showConfirmButton: false
        });
        setTimeout(() => window.location.href = "produk.html", 1200);

      } else {
        // jika backend sudah mengembalikan pesan spesifik (misal kode produk sudah ada)
        let pesan = result.message || "Terjadi kesalahan.";

        if (pesan.toLowerCase().includes("kode") && pesan.toLowerCase().includes("ada")) {
          Swal.fire({
            title: 'Kode Produk Duplikat!',
            text: 'Kode produk sudah terdaftar, silakan gunakan kode lain.',
            icon: 'warning',
            confirmButtonText: 'OK'
          });
        } else {
          Swal.fire({
            title: 'Gagal!',
            text: '❌ ' + pesan,
            icon: 'error',
            confirmButtonText: 'Coba Lagi'
          });
        }
      }
    } catch (error) {
      Swal.fire({
        title: 'Kode Produk Duplikat!',
            text: 'Kode produk sudah terdaftar, silakan gunakan kode lain.',
            icon: 'warning',
            confirmButtonText: 'OK'
          });
    }
  });
</script>

</body>
</html>
