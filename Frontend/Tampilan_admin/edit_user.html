<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; background-color: #d4f5d1; }
    #sidebar { width: 220px; position: fixed; top: 0; left: 0; height: 100vh; }
    .main-content { margin-left: 220px; padding: 20px; }
    .navbar-dashboard { background-color: #4CAF50; color: white; border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; }
    .card { border: none; border-radius: 12px; }
    .form-label { font-weight: 600; }
    .btn-simpan { background-color: #e6d600; border: none; font-weight: bold; }
    .btn-simpan:hover { background-color: #45a049; }
    @media (max-width: 768px) {
      #sidebar { display: none; }
      .main-content { margin-left: 0 !important; padding: 15px; }
      .navbar-dashboard { flex-direction: column; text-align: center; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Desktop -->
  <div id="sidebar" class="d-none d-md-block bg-success text-white p-3">
    <h4 class="fw-bold">
      <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="32" height="32" class="me-2">Jualin
    </h4>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li><a href="produk.html"       class="nav-link text-white ">📦 Produk</a></li>
      <li><a href="user.html"         class="nav-link text-white active">👤 User</a></li>
      <li><a href="laporan.html"      class="nav-link text-white">📑 Laporan</a></li>
      <li><a href="bahan_baku.html"   class="nav-link text-white">🧪 Bahan Baku</a></li>
      <li><a href="resep_produk.html" class="nav-link text-white ">🍳 Resep Produk</a></li>
      <li><a href="http://localhost/Projek_jualin_v0.1/Frontend/login.html" class="nav-link text-danger fw-bold">🚪 Logout</a></li>
    </ul>
  </div>

  <!-- Navbar Mobile -->
  <nav class="navbar bg-success d-md-none px-3 py-2">
    <button class="btn btn-light btn-sm" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">☰ Menu</button>
    <span class="text-white fw-bold ms-2">
      <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="26" height="26" class="me-1">Jualin
    </span>
  </nav>

  <!-- Offcanvas Mobile -->
  <div class="offcanvas offcanvas-start text-bg-success" id="mobileSidebar">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title"><img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="28" height="28" class="me-2">Jualin</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav nav-pills flex-column">
        <li><a href="produk.html"       class="nav-link text-white ">📦 Produk</a></li>
        <li><a href="user.html"         class="nav-link text-white active">👤 User</a></li>
        <li><a href="laporan.html"      class="nav-link text-white">📑 Laporan</a></li>
        <li><a href="bahan_baku.html"   class="nav-link text-white">🧪 Bahan Baku</a></li>
        <li><a href="resep_produk.html" class="nav-link text-white ">🍳 Resep Produk</a></li>
        <li><a href="../login.html"     class="nav-link text-danger fw-bold">🚪 Logout</a></li>
      </ul>
    </div>
  </div>

  <!-- Konten utama -->
  <div class="main-content">
    <div class="container-fluid py-4">
      <!-- HEADER -->
      <div class="navbar-dashboard d-flex justify-content-between align-items-center">
        <h2>✏️ Edit User</h2>
        <a href="user.html" class="btn btn-light">Kembali</a>
      </div>

      <!-- FORM EDIT USER -->
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="fw-bold text-success mb-3">Formulir Edit Data User</h5>
          <form id="editUserForm">
            <div class="mb-3">
              <label for="nama" class="form-label">Nama User</label>
              <input type="text" class="form-control" id="nama" placeholder="Masukkan nama user" required>
            </div>
            <div class="mb-3">
              <label for="role" class="form-label">Role</label>
              <select class="form-select" id="role" required>
                <option value="">-- Pilih Role --</option>
                <option value="admin">Admin</option>
                <option value="kasir">Kasir</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password Baru (opsional)</label>
              <input type="password" class="form-control" id="password" placeholder="Kosongkan jika tidak diganti">
            </div>
            <button type="submit" class="btn btn-simpan w-100">💾 Simpan Perubahan</button>
          </form>
          <div id="msg" class="mt-3 text-center fw-bold"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    // Ambil parameter ID dari URL
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");

    // Load data user berdasarkan ID
    async function loadUser() {
      try {
        const res = await fetch(`http://localhost/Projek_jualin_v0.1/Backend/akun/user.php?id=${userId}`);
        const user = await res.json();

        if (user) {
          document.getElementById("nama").value = user.NAMA;
          document.getElementById("role").value = user.ROLE;
        }
      } catch (error) {
        Swal.fire("Error", "Gagal memuat data user!", "error");
      }
    }

    // Submit form edit user
    document.getElementById("editUserForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const nama = document.getElementById("nama").value;
      const role = document.getElementById("role").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost/Projek_jualin_v0.1/Backend/akun/user.php", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            USER_ID: userId,
            NAMA: nama,
            ROLE: role,
            PASSWORD: password
          })
        });

        const result = await res.json();
        if (result.status) {
          Swal.fire("Berhasil!", "User berhasil diperbarui.", "success")
            .then(() => window.location.href = "user.html");
        } else {
          Swal.fire("Gagal!", result.message || "Terjadi kesalahan.", "error");
        }
      } catch (err) {
        Swal.fire("Error!", "Tidak bisa terhubung ke server", "error");
      }
    });

    if (userId) loadUser();
  </script>
</body>
</html>
