<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah User - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; background-color: #d4f5d1; }
    #sidebar { width: 220px; position: fixed; top: 0; left: 0; height: 100vh; }
    .main-content { margin-left: 220px; padding: 20px; }
    .navbar-dashboard { background-color: #4CAF50; color: white; border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; }
    .btn-simpan { background-color: #e6d600; color: black; font-weight: bold; border: none; padding: 8px 18px; border-radius: 8px; transition: 0.3s; }
    .btn-simpan:hover { background-color: #3e9143; }
    @media (max-width: 768px) {
      #sidebar { display: none; }
      .main-content { margin-left: 0 !important; padding: 15px; }
      .navbar-dashboard { flex-direction: column; text-align: center; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Desktop -->
  <div id="sidebar" class="d-none d-md-block bg-success text-white p-3">
    <h4 class="fw-bold">
      <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="32" height="32" class="me-2">Jualin
    </h4>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li><a href="produk.html"       class="nav-link text-white ">📦 Produk</a></li>
      <li><a href="user.html"         class="nav-link text-white active">👤 User</a></li>
      <li><a href="laporan.html"      class="nav-link text-white">📑 Laporan</a></li>
      <li><a href="bahan_baku.html"   class="nav-link text-white">🧪 Bahan Baku</a></li>
      <li><a href="resep_produk.html" class="nav-link text-white ">🍳 Resep Produk</a></li>
      <li><a href="http://localhost/Projek_jualin_v0.1/Frontend/login.html" class="nav-link text-danger fw-bold">🚪 Logout</a></li>
    </ul>
  </div>

  <!-- Navbar Mobile -->
  <nav class="navbar bg-success d-md-none px-3 py-2">
    <button class="btn btn-light btn-sm" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">☰ Menu</button>
    <span class="text-white fw-bold ms-2">
      <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="26" height="26" class="me-1">Jualin
    </span>
  </nav>

  <!-- Offcanvas Mobile -->
  <div class="offcanvas offcanvas-start text-bg-success" id="mobileSidebar">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title"><img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo2.png" width="28" height="28" class="me-2">Jualin</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav nav-pills flex-column">
        <li><a href="produk.html"       class="nav-link text-white ">📦 Produk</a></li>
        <li><a href="user.html"         class="nav-link text-white active">👤 User</a></li>
        <li><a href="laporan.html"      class="nav-link text-white">📑 Laporan</a></li>
        <li><a href="bahan_baku.html"   class="nav-link text-white">🧪 Bahan Baku</a></li>
        <li><a href="resep_produk.html" class="nav-link text-white ">🍳 Resep Produk</a></li>
        <li><a href="../login.html"     class="nav-link text-danger fw-bold">🚪 Logout</a></li>
      </ul>
    </div>
  </div>
  
  <!-- Konten Utama -->
  <div class="main-content">
    <div class="container-fluid py-4">
      <div class="navbar-dashboard d-flex justify-content-between align-items-center">
        <h2>➕ Tambah User</h2>
        <a href="user.html" class="btn btn-light">Kembali</a>
      </div>

      <!-- Form Tambah User -->
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <form id="registerForm">
            <div class="mb-3">
              <label for="reg_nama" class="form-label fw-bold">Nama</label>
              <input type="text" class="form-control" id="reg_nama" required>
            </div>
            <div class="mb-3">
              <label for="reg_password" class="form-label fw-bold">Password</label>
              <input type="password" class="form-control" id="reg_password" required>
            </div>
            <div class="mb-3">
              <label for="reg_role" class="form-label fw-bold">Role</label>
              <select id="reg_role" class="form-select">
                <option value="Kasir" selected>Kasir</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-simpan">💾 Simpan</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap & SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const nama = document.getElementById("reg_nama").value;
      const password = document.getElementById("reg_password").value;
      const role = document.getElementById("reg_role").value;

      // ✅ Ambil id_toko dari sessionStorage dan sertakan
      const id_toko = sessionStorage.getItem("admin_id_toko");
      if (!id_toko) {
        Swal.fire("Error!", "Session toko tidak ditemukan. Silakan login ulang.", "error");
        setTimeout(() => window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/login.html", 2000);
        return;
      }

      try {
        const res = await fetch("http://localhost/Projek_jualin_v0.1/Backend/akun/user.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ NAMA: nama, PASSWORD: password, ROLE: role, id_toko: id_toko }) // ✅ kirim id_toko
        });

        const result = await res.json();

        if (result.status) {
          Swal.fire({
            title: 'Berhasil!',
            text: 'User baru berhasil ditambahkan.',
            icon: 'success',
            timer: 2000,
            showConfirmButton: false
          });
          setTimeout(() => { window.location.href = "user.html"; }, 1500);
        } else {
          Swal.fire({
            title: 'Gagal!',
            text: result.message || 'Tidak dapat menambah user.',
            icon: 'error',
            confirmButtonText: 'OK'
          });
        }
      } catch (err) {
        Swal.fire({
          title: 'Error!',
          text: 'Terjadi kesalahan koneksi ke server.',
          icon: 'warning',
          confirmButtonText: 'Coba Lagi'
        });
      }
    });
  </script>
</body>
</html>
