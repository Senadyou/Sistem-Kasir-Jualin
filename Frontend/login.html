<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #b2f7c1, #d2fbd5); /* hijau muda gradasi */
      height: 100vh;
    }
    .card {
      border: none;
      border-radius: 15px;
      background-color: #f6fff9; /* putih kehijauan */
    }
    .btn-success {
      background-color: #4CAF50;
      border: none;
      font-weight: bold;
    }
    .btn-success:hover {
      background-color: #45a049;
    }
    a {
      color: #28a745;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .app-title {
      font-size: 1.8rem;
      color: #2e7d32;
      font-weight: bold;
    }
    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg p-4">
          <div class="text-center mb-4">
            <!-- Logo -->
            <img src="http://localhost/Projek_jualin_v0.1/Frontend/assets/img/logo.png" alt="Logo Jualin" class="logo">
            <h3 class="app-title">Jualin</h3>
            <p class="text-muted">Silakan login untuk masuk ke dashboard</p>
          </div>

          <!-- Form Login -->
          <form id="loginForm">
            <div class="mb-3">
              <label for="userid" class="form-label">User ID / Nama</label>
              <input type="text" class="form-control" id="userid" placeholder="Masukkan User ID" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Login</button>
          </form>

          <!-- Pesan -->
          <div id="msg" class="mt-3 text-center fw-bold"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const nama = document.getElementById("userid").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://localhost/Projek_jualin_v0.1/Backend/akun/login.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ NAMA: nama, PASSWORD: password })
    });

    const data = await res.json();

    if (data.status) {
      // Normalisasi role agar tidak sensitif huruf
      const role = (data.ROLE || "").trim();
      // Simpan data sesuai role
      if (role === "Admin") {
        sessionStorage.setItem("admin_id", data.USER_ID);
        sessionStorage.setItem("admin_nama", data.NAMA || nama);
        sessionStorage.setItem("admin_role", data.ROLE);
        sessionStorage.setItem("admin_id_toko", data.id_toko); // ✅ simpan id_toko

        window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/Tampilan_admin/produk.html";

      } else if (role === "Kasir") {
        sessionStorage.setItem("kasir_id", data.USER_ID);
        sessionStorage.setItem("kasir_nama", data.NAMA || nama);
        sessionStorage.setItem("kasir_role", data.ROLE);
        sessionStorage.setItem("kasir_id_toko", data.id_toko);

        window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/Tampilan_kasir/kasir.html";

      } else if (role === "Owner" || role === "owner") {
        sessionStorage.setItem("owner_id", data.USER_ID);
        sessionStorage.setItem("owner_nama", data.NAMA || nama);
        sessionStorage.setItem("owner_role", data.ROLE);
        sessionStorage.setItem("owner_id_toko", data.id_toko);

        window.location.href = "http://localhost/Projek_jualin_v0.1/Frontend/Tampilan_owner/owner_dashboard.html";

      } else {
        document.getElementById("msg").innerText = "❌ Role tidak dikenali!";
        document.getElementById("msg").classList.add("text-danger");
      }

    } else {
      document.getElementById("msg").innerText = "❌ " + data.message;
      document.getElementById("msg").classList.add("text-danger");
    }
  });
</script>

</body>
</html>
