<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Login - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Dekorasi background */
    body::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(78,205,196,0.08) 0%, transparent 70%);
      top: -100px; left: -100px;
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,107,107,0.06) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      border-radius: 50%;
    }

    .login-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .badge-super {
      display: inline-block;
      background: linear-gradient(90deg, #388e3c, #4CAF50);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .login-title {
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-subtitle {
      color: rgba(255,255,255,0.45);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-label {
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-control {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      padding: 12px 16px;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.1);
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.25); }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #388e3c, #4CAF50);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(76,175,80,0.35);
    }
    .btn-login:active { transform: translateY(0); }

    .divider {
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 28px 0 20px;
    }

    .back-link {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      transition: color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.7); }

    #msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }
    #msg.error {
      background: rgba(255,80,80,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      color: #ff6b6b;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="badge-super">⚡ Superadmin</div>
    <h1 class="login-title">Jualin Control</h1>
    <p class="login-subtitle">Masuk sebagai superadmin untuk mengelola semua toko</p>

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="off">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Masukkan password">
    </div>

    <div id="msg"></div>

    <button class="btn-login" onclick="doLogin()">🔐 Masuk sebagai Superadmin</button>

    <div class="divider"></div>
    <a href="http://localhost/Projek_jualin_v0.1/Frontend/superadmin_dashboard.html" class="back-link">
      ← Kembali ke Login Admin Toko
    </a>
  </div>

  <script>
    // Jika sudah login, langsung ke dashboard
    if (sessionStorage.getItem("superadmin_id")) {
      window.location.href = "superadmin_dashboard.html";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      msg.className = "";
      msg.style.display = "none";

      if (!username || !password) {
        msg.textContent = "Username dan password wajib diisi";
        msg.className = "error";
        return;
      }

      try {
        const res = await fetch("http://localhost/Projek_jualin_v0.1/Backend/superadmin/superadmin_login.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.status) {
          sessionStorage.setItem("superadmin_id", data.id);
          sessionStorage.setItem("superadmin_username", data.username);
          window.location.href = "superadmin_dashboard.html";
        } else {
          msg.textContent = "❌ " + data.message;
          msg.className = "error";
        }
      } catch (err) {
        msg.textContent = "⚠️ Tidak bisa terhubung ke server";
        msg.className = "error";
      }
    }
  </script>
</body>
</html>
