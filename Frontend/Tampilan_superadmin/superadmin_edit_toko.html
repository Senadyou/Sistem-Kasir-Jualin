<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Toko - Jualin Superadmin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    #sidebar {
      width: 240px; position: fixed; top: 0; left: 0; height: 100vh;
      background: #1e293b; border-right: 1px solid rgba(255,255,255,0.06);
      padding: 28px 20px; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .sidebar-brand .brand-text { font-size: 1.2rem; font-weight: 800; color: #4CAF50; }
    .sidebar-badge {
      font-size: 0.65rem; background: linear-gradient(90deg, #388e3c, #4CAF50);
      color: #ffffff; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px; margin-bottom: 24px; display: inline-block;
    }
    .sidebar-menu { list-style: none; padding: 0; margin: 0; }
    .sidebar-menu li a {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      border-radius: 10px; color: rgba(255,255,255,0.6); text-decoration: none;
      font-size: 0.9rem; font-weight: 500; transition: all 0.2s; margin-bottom: 4px;
    }
    .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(76,175,80,0.1); color: #4CAF50; }
    .sidebar-bottom { position: absolute; bottom: 24px; left: 20px; right: 20px; }
    .btn-logout {
      width: 100%; padding: 9px; background: rgba(255,80,80,0.1);
      border: 1px solid rgba(255,80,80,0.2); border-radius: 10px;
      color: #ff6b6b; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .btn-logout:hover { background: rgba(255,80,80,0.2); }

    .main-content { margin-left: 240px; padding: 32px; }
    .page-header { margin-bottom: 28px; }
    .breadcrumb-nav { color: rgba(255,255,255,0.35); font-size: 0.85rem; margin-bottom: 8px; }
    .breadcrumb-nav a { color: #4CAF50; text-decoration: none; }
    .breadcrumb-nav a:hover { text-decoration: underline; }
    .page-title { font-size: 1.6rem; font-weight: 800; color: #f8fafc; }

    .form-card {
      background: #1e293b; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px; padding: 32px; max-width: 580px;
    }
    .section-title {
      font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #4CAF50; margin-bottom: 16px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(76,175,80,0.15);
    }
    .form-label { color: rgba(255,255,255,0.6); font-size: 0.85rem; font-weight: 600; }
    .form-control {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0; border-radius: 12px; padding: 11px 14px; font-size: 0.9rem; transition: all 0.2s;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.09); border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.12); color: #e2e8f0;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.2); }
    .divider-section { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 24px 0; }

    .meta-info {
      background: rgba(255,255,255,0.03); border-radius: 12px; padding: 14px 16px;
      margin-bottom: 20px; font-size: 0.82rem; color: rgba(255,255,255,0.4);
    }
    .meta-info span { color: rgba(255,255,255,0.7); font-weight: 600; }

    .btn-simpan {
      background: linear-gradient(90deg, #388e3c, #4CAF50); border: none;
      border-radius: 12px; padding: 13px 32px; color: #ffffff;
      font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.3s;
    }
    .btn-simpan:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(76,175,80,0.3); }
    .btn-batal {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 13px 24px; color: rgba(255,255,255,0.6);
      font-weight: 600; font-size: 0.95rem; cursor: pointer; text-decoration: none; transition: all 0.2s;
    }
    .btn-batal:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }

    .loading-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.3); }

    @media (max-width: 768px) {
      #sidebar { display: none; }
      .main-content { margin-left: 0; padding: 20px; }
      .form-card { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-brand">
      <span style="font-size:1.5rem">🏪</span>
      <span class="brand-text">Jualin</span>
    </div>
    <div class="sidebar-badge">⚡ Superadmin</div>
    <ul class="sidebar-menu">
      <li><a href="superadmin_dashboard.html" class="active">🏬 Kelola Toko</a></li>
    </ul>
    <div class="sidebar-bottom">
      <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="page-header">
      <div class="breadcrumb-nav">
        <a href="superadmin_dashboard.html">🏬 Kelola Toko</a> › Edit Toko
      </div>
      <div class="page-title">✏️ Edit Toko</div>
    </div>

    <div class="form-card">
      <div id="loadingState" class="loading-state">⏳ Memuat data toko...</div>

      <div id="formArea" style="display:none">
        <div class="meta-info" id="metaInfo"></div>

        <div class="section-title">🏪 Informasi Toko</div>
        <div class="mb-3">
          <label class="form-label">Nama Toko <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="nama_toko" placeholder="Nama toko">
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Kota</label>
            <input type="text" class="form-control" id="kota" placeholder="Kota">
          </div>
          <div class="col-md-6">
            <label class="form-label">Alamat</label>
            <input type="text" class="form-control" id="alamat" placeholder="Alamat">
          </div>
        </div>

        <hr class="divider-section">

        <div class="d-flex gap-3">
          <button class="btn-simpan" onclick="simpanEdit()">💾 Simpan Perubahan</button>
          <a href="superadmin_dashboard.html" class="btn-batal">Batal</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!sessionStorage.getItem("superadmin_id")) {
      window.location.href = "login_superadmin.html";
    }

    const params = new URLSearchParams(window.location.search);
    const id_toko = params.get("id");

    if (!id_toko) {
      window.location.href = "superadmin_dashboard.html";
    }

    function logout() {
      sessionStorage.removeItem("superadmin_id");
      sessionStorage.removeItem("superadmin_username");
      window.location.href = "login_superadmin.html";
    }

    async function loadToko() {
      try {
        const res = await fetch(`http://localhost/Projek_jualin_v0.1/Backend/superadmin/superadmin_toko.php?id=${id_toko}`);
        const toko = await res.json();
        if (!toko || !toko.id_toko) {
          Swal.fire("Error", "Toko tidak ditemukan", "error").then(() => {
            window.location.href = "superadmin_dashboard.html";
          });
          return;
        }
        document.getElementById("nama_toko").value = toko.nama_toko || "";
        document.getElementById("kota").value = toko.kota || "";
        document.getElementById("alamat").value = toko.alamat || "";
        document.getElementById("metaInfo").innerHTML =
          `ID Toko: <span>#${toko.id_toko}</span> &nbsp;·&nbsp; Terdaftar: <span>${toko.created_at ? toko.created_at.split(' ')[0] : '-'}</span>`;

        document.getElementById("loadingState").style.display = "none";
        document.getElementById("formArea").style.display = "block";
      } catch {
        Swal.fire("Error", "Tidak bisa memuat data toko", "error");
      }
    }

    async function simpanEdit() {
      const nama_toko = document.getElementById("nama_toko").value.trim();
      const kota      = document.getElementById("kota").value.trim();
      const alamat    = document.getElementById("alamat").value.trim();

      if (!nama_toko) {
        Swal.fire("⚠️", "Nama toko wajib diisi", "warning");
        return;
      }

      try {
        const res = await fetch("http://localhost/Projek_jualin_v0.1/Backend/superadmin/superadmin_toko.php", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id_toko, nama_toko, kota, alamat })
        });
        const data = await res.json();
        if (data.status) {
          await Swal.fire({ title: "✅ Berhasil!", text: "Data toko berhasil diperbarui", icon: "success", timer: 1500, showConfirmButton: false });
          window.location.href = "superadmin_dashboard.html";
        } else {
          Swal.fire("Gagal!", data.message, "error");
        }
      } catch {
        Swal.fire("Error!", "Tidak bisa terhubung ke server", "error");
      }
    }

    loadToko();
  </script>
</body>
</html>
