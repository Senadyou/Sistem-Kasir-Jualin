<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Superadmin - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 240px;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      background: #1e293b;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 28px 20px;
      z-index: 100;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .sidebar-brand .brand-text {
      font-size: 1.2rem;
      font-weight: 800;
      color: #4CAF50;
    }
    .sidebar-badge {
      font-size: 0.65rem;
      background: linear-gradient(90deg, #388e3c, #4CAF50);
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: inline-block;
    }
    .sidebar-menu { list-style: none; padding: 0; margin: 0; }
    .sidebar-menu li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 4px;
    }
    .sidebar-menu li a:hover,
    .sidebar-menu li a.active {
      background: rgba(76,175,80,0.1);
      color: #4CAF50;
    }
    .sidebar-bottom {
      position: absolute;
      bottom: 24px; left: 20px; right: 20px;
    }
    .sidebar-user {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .user-avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #388e3c, #4CAF50);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #ffffff;
      font-weight: 800;
      flex-shrink: 0;
    }
    .user-name { font-size: 0.85rem; font-weight: 600; color: #e2e8f0; }
    .user-role { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
    .btn-logout {
      width: 100%;
      padding: 9px;
      background: rgba(255,80,80,0.1);
      border: 1px solid rgba(255,80,80,0.2);
      border-radius: 10px;
      color: #ff6b6b;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: rgba(255,80,80,0.2); }

    /* ── MAIN CONTENT ── */
    .main-content {
      margin-left: 240px;
      padding: 32px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-title { font-size: 1.6rem; font-weight: 800; color: #f8fafc; }
    .page-title span { color: #4CAF50; }
    .page-subtitle { color: rgba(255,255,255,0.4); font-size: 0.9rem; margin-top: 2px; }

    .btn-tambah-toko {
      background: linear-gradient(90deg, #388e3c, #4CAF50);
      border: none;
      border-radius: 12px;
      padding: 11px 22px;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .btn-tambah-toko:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(76,175,80,0.3);
      color: #ffffff;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px 24px;
    }
    .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 2rem; font-weight: 800; color: #4CAF50; margin: 4px 0 0; }

    /* Search */
    .search-box {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 16px;
      color: #e2e8f0;
      font-size: 0.9rem;
      width: 260px;
    }
    .search-box:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .search-box::placeholder { color: rgba(255,255,255,0.25); }

    /* Toko cards */
    .toko-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .toko-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 24px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .toko-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #388e3c, #4CAF50);
    }
    .toko-card:hover {
      border-color: rgba(76,175,80,0.2);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .toko-id {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .toko-nama {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .toko-lokasi {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
    }

    .toko-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 18px;
    }
    .toko-stat {
      display: flex;
      flex-direction: column;
    }
    .toko-stat-val {
      font-size: 1.3rem;
      font-weight: 800;
      color: #4CAF50;
    }
    .toko-stat-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
    }

    .toko-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 0 0 16px;
    }

    .toko-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-aksi {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-detail {
      background: rgba(78,205,196,0.1);
      color: #4ecdc4;
      border: 1px solid rgba(78,205,196,0.2);
    }
    .btn-detail:hover { background: rgba(78,205,196,0.2); color: #4ecdc4; }
    .btn-edit {
      background: rgba(76,175,80,0.1);
      color: #4CAF50;
      border: 1px solid rgba(76,175,80,0.2);
    }
    .btn-edit:hover { background: rgba(76,175,80,0.2); color: #4CAF50; }
    .btn-hapus {
      background: rgba(255,80,80,0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255,80,80,0.2);
    }
    .btn-hapus:hover { background: rgba(255,80,80,0.2); color: #ff6b6b; }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.3);
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }

    /* Modal user */
    .modal-dark .modal-content {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
    }
    .modal-dark .modal-header {
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(76,175,80,0.08);
    }
    .modal-dark .modal-title { color: #4CAF50; font-weight: 700; }
    .modal-dark .modal-footer { border-top: 1px solid rgba(255,255,255,0.06); }
    .modal-dark .form-control, .modal-dark .form-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      border-radius: 10px;
    }
    .modal-dark .form-control:focus, .modal-dark .form-select:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
    }
    .modal-dark .form-label { color: rgba(255,255,255,0.6); font-size: 0.85rem; }
    .modal-dark .btn-close { filter: invert(1); }
    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .user-role-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .role-admin { background: rgba(76,175,80,0.15); color: #4CAF50; }
    .role-kasir { background: rgba(78,205,196,0.15); color: #4ecdc4; }
    .role-owner { background: rgba(255,167,38,0.15); color: #ffb74d; }

    @media (max-width: 768px) {
      #sidebar { display: none; }
      .main-content { margin-left: 0; padding: 20px; }
      .stats-bar { grid-template-columns: 1fr; }
      .toko-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-brand">
      <span style="font-size:1.5rem">🏪</span>
      <span class="brand-text">Jualin</span>
    </div>
    <div class="sidebar-badge">⚡ Superadmin</div>

    <ul class="sidebar-menu">
      <li><a href="superadmin_dashboard.html" class="active">🏬 Kelola Toko</a></li>
    </ul>

    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="user-avatar" id="avatarChar">S</div>
        <div>
          <div class="user-name" id="sidebarUsername">Superadmin</div>
          <div class="user-role">Super Administrator</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Kelola <span>Toko</span></div>
        <div class="page-subtitle">Manajemen semua toko yang menggunakan Jualin</div>
      </div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <input type="text" class="search-box" id="searchToko" placeholder="🔍 Cari nama toko...">
        <a href="superadmin_tambah_toko.html" class="btn-tambah-toko">➕ Tambah Toko Baru</a>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Toko</div>
        <div class="stat-value" id="statToko">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total User</div>
        <div class="stat-value" id="statUser">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Produk</div>
        <div class="stat-value" id="statProduk">—</div>
      </div>
    </div>

    <!-- TOKO GRID -->
    <div class="toko-grid" id="tokoGrid">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>Memuat data toko...</p>
      </div>
    </div>
  </div>

  <!-- MODAL DETAIL USER -->
  <div class="modal fade modal-dark" id="modalUser" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">👥 User Toko: <span id="modalTokoNama"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- Form tambah user -->
          <div class="card mb-3" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;">
            <div class="card-body">
              <h6 style="color:#4CAF50;font-weight:700;margin-bottom:14px;">➕ Tambah User Baru</h6>
              <div class="row g-2">
                <div class="col-md-4">
                  <label class="form-label">Nama</label>
                  <input type="text" class="form-control" id="newUserNama" placeholder="Nama user">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" id="newUserPass" placeholder="Password">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Role</label>
                  <select class="form-select" id="newUserRole">
                    <option value="Kasir">Kasir</option>
                    <option value="Admin">Admin</option>
                    <option value="Owner">Owner</option>
                  </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button class="btn btn-warning w-100 fw-bold" onclick="tambahUser()">Simpan</button>
                </div>
              </div>
            </div>
          </div>
          <!-- Daftar user -->
          <div id="userList"><p class="text-center" style="color:rgba(255,255,255,0.3)">Memuat user...</p></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = "http://localhost/Projek_jualin_v0.1/Backend/superadmin/";
    let allToko = [];
    let activeIdToko = null;

    // Cek session
    const username = sessionStorage.getItem("superadmin_username");
    if (!sessionStorage.getItem("superadmin_id")) {
      window.location.href = "login_superadmin.html";
    }
    document.getElementById("sidebarUsername").textContent = username || "Superadmin";
    document.getElementById("avatarChar").textContent = (username || "S")[0].toUpperCase();

    function logout() {
      sessionStorage.removeItem("superadmin_id");
      sessionStorage.removeItem("superadmin_username");
      window.location.href = "login_superadmin.html";
    }

    async function loadToko() {
      try {
        const res = await fetch(API + "superadmin_toko.php");
        allToko = await res.json();
        renderToko(allToko);

        // Update stats
        const totalUser = allToko.reduce((s, t) => s + parseInt(t.jumlah_user || 0), 0);
        const totalProduk = allToko.reduce((s, t) => s + parseInt(t.jumlah_produk || 0), 0);
        document.getElementById("statToko").textContent = allToko.length;
        document.getElementById("statUser").textContent = totalUser;
        document.getElementById("statProduk").textContent = totalProduk;
      } catch (err) {
        document.getElementById("tokoGrid").innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>Gagal memuat data toko</p>
          </div>`;
      }
    }

    function renderToko(data) {
      const grid = document.getElementById("tokoGrid");
      if (!data.length) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🏪</div><p>Belum ada toko terdaftar</p></div>`;
        return;
      }
      grid.innerHTML = data.map(t => `
        <div class="toko-card">
          <div class="toko-id">ID TOKO #${t.id_toko}</div>
          <div class="toko-nama">${t.nama_toko}</div>
          <div class="toko-lokasi">📍 ${t.kota || '-'} ${t.alamat ? '· ' + t.alamat : ''}</div>
          <div class="toko-stats">
            <div class="toko-stat">
              <span class="toko-stat-val">${t.jumlah_user || 0}</span>
              <span class="toko-stat-label">User</span>
            </div>
            <div class="toko-stat">
              <span class="toko-stat-val">${t.jumlah_produk || 0}</span>
              <span class="toko-stat-label">Produk</span>
            </div>
          </div>
          <hr class="toko-divider">
          <div class="toko-actions">
            <a class="btn-aksi btn-detail" onclick="lihatUser(${t.id_toko}, '${t.nama_toko}')">👥 User</a>
            <a href="superadmin_edit_toko.html?id=${t.id_toko}" class="btn-aksi btn-edit">✏️ Edit</a>
            <button class="btn-aksi btn-hapus" onclick="hapusToko(${t.id_toko}, '${t.nama_toko}')">🗑️ Hapus</button>
          </div>
        </div>
      `).join("");
    }

    // Cari toko
    document.getElementById("searchToko").addEventListener("input", function() {
      const kw = this.value.toLowerCase();
      renderToko(allToko.filter(t => t.nama_toko.toLowerCase().includes(kw)));
    });

    // Lihat user toko
    async function lihatUser(id_toko, nama_toko) {
      activeIdToko = id_toko;
      document.getElementById("modalTokoNama").textContent = nama_toko;
      const modal = new bootstrap.Modal(document.getElementById("modalUser"));
      modal.show();
      loadUserToko(id_toko);
    }

    async function loadUserToko(id_toko) {
      const div = document.getElementById("userList");
      div.innerHTML = `<p style="color:rgba(255,255,255,0.3);text-align:center">Memuat...</p>`;
      try {
        const res = await fetch(API + `superadmin_user.php?id_toko=${id_toko}`);
        const users = await res.json();
        if (!users.length) {
          div.innerHTML = `<p style="color:rgba(255,255,255,0.3);text-align:center">Belum ada user</p>`;
          return;
        }
        div.innerHTML = users.map(u => `
          <div class="user-list-item">
            <div>
              <span style="font-weight:600;color:#e2e8f0">${u.NAMA}</span>
              <span class="user-role-badge ${u.ROLE === 'Admin' ? 'role-admin' : u.ROLE === 'Owner' ? 'role-owner' : 'role-kasir'} ms-2">${u.ROLE}</span>
            </div>
            <button class="btn btn-sm" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.2);color:#ff6b6b;border-radius:8px;font-size:0.75rem;"
              onclick="hapusUser(${u.USER_ID}, '${u.NAMA}')">🗑️ Hapus</button>
          </div>
        `).join("");
      } catch {
        div.innerHTML = `<p style="color:#ff6b6b;text-align:center">Gagal memuat user</p>`;
      }
    }

    async function tambahUser() {
      const nama = document.getElementById("newUserNama").value.trim();
      const pass = document.getElementById("newUserPass").value;
      const role = document.getElementById("newUserRole").value;
      if (!nama || !pass) { Swal.fire("⚠️", "Nama dan password wajib diisi", "warning"); return; }

      const res = await fetch(API + "superadmin_user.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nama, password: pass, role, id_toko: activeIdToko })
      });
      const data = await res.json();
      if (data.status) {
        document.getElementById("newUserNama").value = "";
        document.getElementById("newUserPass").value = "";
        Swal.fire({ title: "Berhasil!", text: "User berhasil ditambahkan", icon: "success", timer: 1500, showConfirmButton: false });
        loadUserToko(activeIdToko);
      } else {
        Swal.fire("Gagal!", data.message, "error");
      }
    }

    async function hapusUser(userId, nama) {
      const confirm = await Swal.fire({
        title: `Hapus user "${nama}"?`,
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Ya, Hapus",
        cancelButtonText: "Batal",
        confirmButtonColor: "#d33"
      });
      if (!confirm.isConfirmed) return;
      const res = await fetch(API + "superadmin_user.php", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ USER_ID: userId })
      });
      const data = await res.json();
      if (data.status) {
        Swal.fire({ title: "Terhapus!", icon: "success", timer: 1200, showConfirmButton: false });
        loadUserToko(activeIdToko);
        loadToko();
      }
    }

    async function hapusToko(id_toko, nama) {
      const confirm = await Swal.fire({
        title: `Hapus toko "${nama}"?`,
        text: "Semua user toko ini juga akan terpengaruh!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Ya, Hapus",
        cancelButtonText: "Batal",
        confirmButtonColor: "#d33"
      });
      if (!confirm.isConfirmed) return;
      const res = await fetch(API + "superadmin_toko.php", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id_toko })
      });
      const data = await res.json();
      if (data.status) {
        Swal.fire({ title: "Terhapus!", icon: "success", timer: 1200, showConfirmButton: false });
        loadToko();
      } else {
        Swal.fire("Gagal!", data.message, "error");
      }
    }

    loadToko();
  </script>
</body>
</html>
