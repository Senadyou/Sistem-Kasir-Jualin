<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tanda Bukti Pembayaran</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .bukti { max-width: 350px; margin:auto; border:1px solid #3bb54a; padding:15px; border-radius:8px; }
    h3 { text-align:center; margin-bottom:10px; color:#3bb54a; }
    .info { font-size:14px; margin-bottom:10px; }
    .total { font-weight:bold; font-size:16px; text-align:right; margin-top:10px; }
    .footer { text-align:center; margin-top:10px; font-size:12px; color:#555; }
  </style>
</head>
<body>
  <div class="bukti">
    <h3>Tanda Bukti Pembayaran</h3>
    <div id="bukti-content"></div>
    <div class="footer">Pembayaran telah diterima </div>
  </div>

  <script>
    const data = JSON.parse(sessionStorage.getItem("lastTransaction"));
    if(data){
      let html = `
        <div class="info">Metode: ${data.metode.toUpperCase()}</div>
        <div class="info">Jumlah Item: ${data.items.length}</div>
        <div class="total">Total: Rp ${data.total}</div>
      `;
      document.getElementById("bukti-content").innerHTML = html;
      window.print(); // otomatis cetak
    }
  </script>
</body>
</html>
