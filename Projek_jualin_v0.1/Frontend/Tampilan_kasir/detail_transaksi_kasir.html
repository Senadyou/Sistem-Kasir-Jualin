<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Transaksi - Jualin POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #3bb54a;
      --primary-dark: #2e8b39;
      --primary-light: #e8f5e9;
      --bg-color: #f4fbf4;
      --surface: #ffffff;
      --text-main: #1a2e1a;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .pos-sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    .brand-area {
      height: 70px; display: flex; align-items: center; padding: 0 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .brand-area img { height: 32px; margin-right: 10px; }
    .brand-area span { font-weight: 800; font-size: 1.2rem; color: var(--primary-dark); }
    
    .nav-menu { padding: 20px 12px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; padding: 12px 16px;
      color: var(--text-muted); text-decoration: none;
      font-weight: 600; font-size: 0.95rem; border-radius: 8px;
      margin-bottom: 8px; transition: 0.2s;
    }
    .nav-item.active { background: var(--primary-light); color: var(--primary-dark); }
    .nav-item:hover:not(.active) { background: #f9f9f9; color: var(--text-main); }
    
    .user-area { padding: 20px; border-top: 1px solid var(--border-color); }
    .user-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 12px; display: block; }
    .btn-logout {
      width: 100%; background: #ffebee; color: #c62828; border: none;
      padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-logout:hover { background: #ffcdd2; }

    /* ── MAIN CONTENT ── */
    .pos-main {
      flex: 1; margin-left: 220px; display: flex; flex-direction: column; width: 100%;
    }
    
    .top-toolbar {
      height: 70px; background: var(--surface); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
      position: sticky; top: 0; z-index: 90;
    }
    .page-title { font-weight: 800; font-size: 1.2rem; margin: 0; color: var(--text-main); }
    .btn-back {
      background: #f5f5f5; color: var(--text-main); border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s;
      text-decoration: none; display: inline-block;
    }
    .btn-back:hover { background: #e0e0e0; color: var(--text-main); }

    .content-area { 
      padding: 32px 24px; display: flex; flex-direction: column; align-items: center; flex: 1; 
    }

    /* ── INVOICE CARD ── */
    .invoice-card {
      background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 600px;
      box-shadow: var(--shadow-sm); border: 1px solid #f0f7f0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    
    .invoice-header {
      background: var(--primary-light); padding: 24px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .invoice-id-label { font-size: 0.8rem; font-weight: 700; color: var(--primary-dark); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
    .invoice-id { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin: 0; }
    .invoice-status { background: var(--primary); color: #fff; font-size: 0.8rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px; }

    .invoice-body { padding: 24px; }
    
    .invoice-meta {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;
      background: #fafdfa; padding: 16px; border-radius: 8px; border: 1px solid #f0f0f0;
    }
    .meta-group label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block; }
    .meta-group div { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

    .items-header {
      display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 2px solid var(--border-color);
      margin-bottom: 12px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
    }
    .item-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed #f0f0f0; }
    .item-row:last-child { border-bottom: none; }
    .item-name { font-weight: 600; font-size: 0.95rem; color: var(--text-main); margin-bottom: 2px; }
    .item-qty { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .item-subtotal { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }

    .invoice-total {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 16px; margin-top: 8px; border-top: 2px solid var(--border-color);
    }
    .total-label { font-size: 1.1rem; font-weight: 700; color: var(--text-muted); }
    .total-val { font-size: 1.6rem; font-weight: 800; color: var(--primary-dark); }

    .invoice-actions {
      padding: 20px 24px; background: #fafdfa; border-top: 1px solid var(--border-color);
      display: flex; gap: 12px; justify-content: flex-end;
    }
    .btn-action {
      padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
      border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-action.primary { background: var(--primary); color: #fff; }
    .btn-action.primary:hover { background: var(--primary-dark); }
    .btn-action.secondary { background: #fff; color: var(--primary-dark); border: 1px solid var(--primary); }
    .btn-action.secondary:hover { background: var(--primary-light); }

    /* ── LOADING & ERROR STATE ── */
    .state-message { text-align: center; padding: 40px 20px; font-weight: 600; color: var(--text-muted); font-size: 1rem; }
    .state-message.error { color: #c62828; }

    /* ── MOBILE UI ── */
    .m-navbar { display: none; }

    @media (max-width: 992px) {
      body { flex-direction: column; } /* Mencegah layout menyamping di mobile */
      .pos-sidebar { display: none; }
      .pos-main { margin-left: 0; width: 100%; }
      
      .m-navbar {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--primary); padding: 14px 20px; color: #fff;
        position: sticky; top: 0; z-index: 100; width: 100%;
      }
      .m-brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;}
      .m-brand img { height: 28px; }
      .m-menu-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 600; }

      .top-toolbar { display: none; }
      .content-area { padding: 16px; }
      
      .invoice-card { max-width: 100%; border-radius: 12px; }
      .invoice-header { padding: 20px 16px; flex-direction: column; align-items: flex-start; gap: 12px; }
      .invoice-body { padding: 16px; }
      .invoice-meta { grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
      
      .invoice-actions { flex-direction: column; padding: 16px; }
      .btn-action { width: 100%; }
      .btn-back-mobile {
        display: block; width: 100%; background: #f5f5f5; color: var(--text-main);
        text-align: center; padding: 12px; border-radius: 8px; font-weight: 600;
        text-decoration: none; margin-bottom: 16px;
      }
    }
    @media (min-width: 993px) {
      .btn-back-mobile { display: none; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Desktop -->
  <aside class="pos-sidebar d-none d-lg-flex">
    <div class="brand-area">
      <img src="../assets/img/logo.png" alt="Logo">
      <span>Jualin </span>
    </div>
    <nav class="nav-menu">
      <a href="kasir.html" class="nav-item">Kasir</a>
      <a href="riwayat_transaksi_kasir.html" class="nav-item active">Riwayat Transaksi</a>
    </nav>
    <div class="user-area">
      <span class="user-name" id="user-name-desktop">Kasir</span>
      <button class="btn-logout" onclick="logout()">Keluar Sesi</button>
    </div>
  </aside>

  <!-- Navbar Mobile -->
  <div class="m-navbar d-lg-none">
    <div class="m-brand">
      <img src="../assets/img/logo2.png" alt="Logo">
      Jualin 
    </div>
    <button class="m-menu-btn" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">Menu</button>
  </div>

  <!-- Offcanvas Mobile -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMobile">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold">Jualin </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-3 d-flex flex-column">
      <nav class="nav flex-column gap-2 mb-auto">
        <a class="nav-item" href="kasir.html" style="background:#f5f5f5; color:var(--text-main); padding:12px; border-radius:8px; text-decoration:none; font-weight:600;">Kasir</a>
        <a class="nav-item active" href="riwayat_transaksi_kasir.html" style="background:var(--primary-light); color:var(--primary-dark); padding:12px; border-radius:8px; text-decoration:none; font-weight:600;">Riwayat Transaksi</a>
      </nav>
      <div class="mt-4">
        <span class="user-name" id="user-name-mobile" style="font-weight:700; margin-bottom:12px; display:block;">Kasir</span>
        <button class="btn-logout" onclick="logout()">Keluar Sesi</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="pos-main">
    
    <div class="top-toolbar">
      <h1 class="page-title">Detail Transaksi</h1>
      <a href="riwayat_transaksi_kasir.html" class="btn-back">Kembali</a>
    </div>

    <div class="content-area">
      <a href="riwayat_transaksi_kasir.html" class="btn-back-mobile">Kembali</a>
      
      <div class="invoice-card" id="transaction-detail">
        <div class="state-message">Memuat rincian data...</div>
      </div>

    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function ensureKasirAuth() {
    const nama = sessionStorage.getItem("kasir_nama");
    const role = sessionStorage.getItem("kasir_role");
    const id_toko = sessionStorage.getItem("kasir_id_toko");
    if (!nama || role !== "Kasir" || !id_toko) {
      window.location.href = "../login.html";
      return false;
    }
    const elDesk = document.getElementById("user-name-desktop");
    const elMob  = document.getElementById("user-name-mobile");
    if (elDesk) elDesk.innerText = nama;
    if (elMob)  elMob.innerText = nama;
    return true;
  }

  function logout() {
    sessionStorage.removeItem("kasir_id");
    sessionStorage.removeItem("kasir_nama");
    sessionStorage.removeItem("kasir_role");
    sessionStorage.removeItem("kasir_token");
    window.location.href = "../login.html";
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!ensureKasirAuth()) return;
    loadDetailTransaksi();
  });

  const params = new URLSearchParams(window.location.search);
  const kode = params.get("kode");

  function loadDetailTransaksi() {
    const id_toko = sessionStorage.getItem("kasir_id_toko");
    fetch(`../../Backend/transaksi/detail_transaksi.php?kode=${kode}&id_toko=${id_toko}`)
      .then(res => res.json())
      .then(trx => {
        if (!trx || !trx.KODE_TRANSAKSI) {
          document.getElementById("transaction-detail").innerHTML = `<div class="state-message error">Data transaksi tidak ditemukan.</div>`;
          return;
        }
        renderDetail(trx);
      })
      .catch(err => {
        document.getElementById("transaction-detail").innerHTML = `<div class="state-message error">Gagal terhubung ke sistem.</div>`;
      });
  }

  function renderDetail(trx) {
    const div = document.getElementById("transaction-detail");
    
    const itemList = trx.ITEMS.map(it => `
      <div class="item-row">
        <div>
          <div class="item-name">${it.nama}</div>
          <div class="item-qty">${it.jumlah} Unit x Rp ${parseInt(it.harga || (it.subtotal/it.jumlah)).toLocaleString("id-ID")}</div>
        </div>
        <div class="item-subtotal">Rp ${parseInt(it.subtotal).toLocaleString("id-ID")}</div>
      </div>
    `).join("");

    div.innerHTML = `
      <div class="invoice-header">
        <div>
          <span class="invoice-id-label">Kode Referensi</span>
          <h2 class="invoice-id">${trx.KODE_TRANSAKSI}</h2>
        </div>
        <span class="invoice-status">Selesai</span>
      </div>
      <div class="invoice-body">
        <div class="invoice-meta">
          <div class="meta-group">
            <label>Tanggal Waktu</label>
            <div>${trx.TANGGAL}</div>
          </div>
          <div class="meta-group">
            <label>Metode</label>
            <div>${trx.METODE.toUpperCase()}</div>
          </div>
          <div class="meta-group">
            <label>Kasir</label>
            <div>${sessionStorage.getItem("kasir_nama")}</div>
          </div>
        </div>
        
        <div class="invoice-items">
          <div class="items-header">
            <span>Deskripsi Item</span>
            <span>Subtotal</span>
          </div>
          ${itemList}
        </div>
        
        <div class="invoice-total">
          <span class="total-label">Total Tagihan</span>
          <span class="total-val">Rp ${parseInt(trx.TOTAL).toLocaleString("id-ID")}</span>
        </div>
      </div>
      <div class="invoice-actions">
        <button class="btn-action secondary" onclick="bagikan()">Bagikan Data</button>
        <button class="btn-action primary" onclick="cetakStruk()">Cetak Struk</button>
      </div>
    `;
  }

  function cetakStruk() {
    window.location.href = "struk.html?kode=" + kode;
  }

  function bagikan(){
    if(navigator.share){
      navigator.share({
        title: "Transaksi " + kode,
        text: "Detail tagihan transaksi dari Jualin POS",
        url: window.location.href
      });
    } else {
      alert("Sistem peramban ini belum mendukung fitur berbagi langsung.");
    }
  }
</script>
</body>
</html>
