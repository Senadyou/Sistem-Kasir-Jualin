<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jualin POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* =========================================
       GLOBAL & BACKGROUND
       ========================================= */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #d4f5d1; /* Tema hijau muda dipertahankan */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Dekorasi Shape Futuristik di Background */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
    }
    .shape-1 {
      width: 400px; height: 400px;
      background: rgba(76, 175, 80, 0.4);
      top: -100px; left: -100px;
    }
    .shape-2 {
      width: 500px; height: 500px;
      background: rgba(255, 255, 255, 0.6);
      bottom: -150px; right: -100px;
    }

    /* =========================================
       LOGIN WRAPPER & SPLIT CARD
       ========================================= */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1000px; /* Membuat tampilan penuh dan tidak kopong */
      padding: 20px;
    }

    .login-card {
      display: flex;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(27, 94, 32, 0.15);
      overflow: hidden;
      min-height: 600px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* =========================================
       LEFT SIDE (BRANDING)
       ========================================= */
    .brand-side {
      flex: 1;
      background: linear-gradient(135deg, #1b5e20 0%, #388e3c 100%);
      padding: 50px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Aksen visual di panel hijau */
    .brand-side::before {
      content: ''; position: absolute;
      width: 300px; height: 300px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -50px; right: -50px;
    }
    .brand-side::after {
      content: ''; position: absolute;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -30px; left: -30px;
    }

    .brand-side .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 24px;
      position: relative; z-index: 2;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .brand-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
      position: relative; z-index: 2;
    }

    .brand-subtitle {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
      font-weight: 500;
      position: relative; z-index: 2;
    }

    /* =========================================
       RIGHT SIDE (FORM)
       ========================================= */
    .form-side {
      flex: 1.2;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
    }

    .form-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1a2e1a;
      margin-bottom: 6px;
    }

    .form-subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 36px;
    }

    .form-label {
      font-weight: 700;
      color: #2e7d32;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-control {
      background: #f9fdf9;
      border: 1.5px solid #dceede;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 1rem;
      transition: all 0.3s ease;
      color: #333;
    }

    .form-control:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15);
      background: #ffffff;
    }

    .form-control::placeholder {
      color: #aebfab;
    }

    .btn-login {
      background: linear-gradient(135deg, #388e3c, #4CAF50);
      color: #fff;
      font-weight: 800;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(76, 175, 80, 0.25);
      transition: all 0.3s;
      width: 100%;
      margin-top: 16px;
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(76, 175, 80, 0.35);
      color: #fff;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Error Message Box */
    #msg {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 20px;
      text-align: center;
    }
    #msg.show-error {
      display: block;
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    /* =========================================
       MOBILE RESPONSIVENESS
       ========================================= */
    @media (max-width: 991px) {
      .login-wrapper {
        padding: 0;
        height: 100vh;
      }
      .login-card {
        flex-direction: column;
        border-radius: 0;
        min-height: 100vh;
        border: none;
      }
      .brand-side {
        flex: none;
        padding: 40px 30px;
        text-align: center;
      }
      .brand-side .logo-img {
        width: 70px; height: 70px; margin: 0 auto 16px;
      }
      .brand-title { font-size: 2rem; }
      .brand-subtitle { font-size: 0.9rem; }
      
      .form-side {
        flex: 1;
        padding: 40px 30px;
        border-radius: 30px 30px 0 0;
        margin-top: -20px;
        z-index: 5;
      }
    }
  </style>
</head>
<body>

  <!-- Abstract Background Shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Panel Kiri: Branding -->
      <div class="brand-side">
        <img src="assets/img/logo.png" alt="Logo Jualin" class="logo-img" onerror="this.src='https://via.placeholder.com/90x90?text=Logo'">
        <h1 class="brand-title">Jualin</h1>
        <p class="brand-subtitle">
          Sistem Point of Sale cerdas. Kelola penjualan, stok produk, bahan baku, dan laporan toko Anda dalam satu platform.
        </p>
      </div>

      <!-- Panel Kanan: Form Login -->
      <div class="form-side">
        <div class="form-title">Selamat Datang</div>
        <div class="form-subtitle">Silakan masuk menggunakan akun Anda</div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="userid" class="form-label">User ID / Nama Pengguna</label>
            <input type="text" class="form-control" id="userid" placeholder="Ketik nama Anda di sini..." required autocomplete="off">
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label">Kata Sandi</label>
            <input type="password" class="form-control" id="password" placeholder="Ketik kata sandi di sini..." required>
          </div>
          
          <button type="submit" class="btn-login">Login</button>
        </form>

        <div id="msg"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const nama = document.getElementById("userid").value;
    const password = document.getElementById("password").value;
    const msgBox = document.getElementById("msg");

    // Reset status pesan
    msgBox.className = "";
    msgBox.innerText = "";

    try {
      // Fetch ke Backend menggunakan relative path (naik 1 folder dari Frontend)
      const res = await fetch("../Backend/akun/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ NAMA: nama, PASSWORD: password })
      });

      const data = await res.json();

      if (data.status) {
        // Normalisasi role agar tidak sensitif huruf
        const role = (data.ROLE || "").trim();
        
        // Simpan data sesuai role
        if (role === "Admin") {
          sessionStorage.setItem("admin_id", data.USER_ID);
          sessionStorage.setItem("admin_nama", data.NAMA || nama);
          sessionStorage.setItem("admin_role", data.ROLE);
          sessionStorage.setItem("admin_id_toko", data.id_toko);

          // Redirect ke folder Tampilan_admin
          window.location.href = "Tampilan_admin/produk.html";

        } else if (role === "Kasir") {
          sessionStorage.setItem("kasir_id", data.USER_ID);
          sessionStorage.setItem("kasir_nama", data.NAMA || nama);
          sessionStorage.setItem("kasir_role", data.ROLE);
          sessionStorage.setItem("kasir_id_toko", data.id_toko);

          // Redirect ke folder Tampilan_kasir
          window.location.href = "Tampilan_kasir/kasir.html";

        } else if (role === "Owner" || role === "owner") {
          sessionStorage.setItem("owner_id", data.USER_ID);
          sessionStorage.setItem("owner_nama", data.NAMA || nama);
          sessionStorage.setItem("owner_role", data.ROLE);
          sessionStorage.setItem("owner_id_toko", data.id_toko);

          // Redirect ke folder Tampilan_owner
          window.location.href = "Tampilan_owner/owner_dashboard.html";

        } else {
          msgBox.innerText = "❌ Role akun tidak dikenali!";
          msgBox.classList.add("show-error");
        }

      } else {
        msgBox.innerText = "❌ " + data.message;
        msgBox.classList.add("show-error");
      }
    } catch (error) {
      msgBox.innerText = "❌ Terjadi kesalahan saat menghubungi server.";
      msgBox.classList.add("show-error");
      console.error("Fetch Error:", error);
    }
  });
  </script>

</body>
</html>
