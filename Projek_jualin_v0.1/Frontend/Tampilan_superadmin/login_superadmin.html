<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Login - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #3bb54a;
      --primary-dark: #1b5e20;
      --primary-light: #e8f5e9;
      --bg-color: #d4f5d1;
      --surface: #ffffff;
      --text-main: #1a2e1a;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 16px;
      --danger: #d32f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-md);
    }

    .badge-super {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .login-title {
      color: var(--primary-dark);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 32px;
    }

    .form-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: 0.2s;
      width: 100%;
    }
    
    .form-control:focus {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,181,74,0.1);
      outline: none;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 12px;
    }
    
    .btn-login:hover { background: var(--primary-dark); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .divider {
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    .back-link {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: 0.2s;
    }
    
    .back-link:hover { color: var(--primary-dark); }

    #msg {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
    
    #msg.error { background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; }
    #msg.success { background: var(--primary-light); color: var(--primary-dark); border: 1px solid #c8e6c9; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="badge-super">Superadmin</div>
    <h1 class="login-title">Jualin</h1>
    <p class="login-subtitle">Akses kendali sistem administrator</p>

    <div class="mb-3">
      <label class="form-label">Nama Pengguna</label>
      <input type="text" id="username" class="form-control" placeholder="Ketik nama pengguna..." autocomplete="off">
    </div>
    <div class="mb-3">
      <label class="form-label">Kata Sandi</label>
      <input type="password" id="password" class="form-control" placeholder="Ketik kata sandi...">
    </div>

    <div id="msg"></div>

    <button class="btn-login" id="btnLogin" onclick="doLogin()">Masuk Sistem</button>

    <div class="divider"></div>
    <a href="../login.html" class="back-link">Kembali ke Portal Kasir</a>
  </div>

  <script>
    if (sessionStorage.getItem("superadmin_id")) {
      window.location.href = "superadmin_dashboard.html";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    function showMsg(text, type = "error") {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = type;
      msg.style.display = "block";
    }

    function hideMsg() {
      const msg = document.getElementById("msg");
      msg.style.display = "none";
      msg.className = "";
      msg.textContent = "";
    }

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btnLogin");

      hideMsg();

      if (!username || !password) {
        showMsg("Formulir tidak lengkap");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Memproses Data...";

      try {
        const res = await fetch("../../Backend/superadmin/superadmin_login.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          showMsg("Kegagalan respons dari server");
          return;
        }

        if (data.status) {
          showMsg("Verifikasi berhasil, mengalihkan...", "success");
          sessionStorage.setItem("superadmin_id", data.id);
          sessionStorage.setItem("superadmin_username", data.username);
          setTimeout(() => {
            window.location.href = "superadmin_dashboard.html";
          }, 800);
        } else {
          showMsg(data.message || "Nama pengguna atau kata sandi tidak valid");
        }

      } catch (err) {
        showMsg("Gagal terhubung ke jaringan server");
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk Sistem";
      }
    }
  </script>
</body>
</html>
