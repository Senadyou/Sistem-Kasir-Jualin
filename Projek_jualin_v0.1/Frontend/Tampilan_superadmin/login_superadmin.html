<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Login - Jualin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(78,205,196,0.08) 0%, transparent 70%);
      top: -100px; left: -100px;
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,107,107,0.06) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      border-radius: 50%;
    }

    .login-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .badge-super {
      display: inline-block;
      background: linear-gradient(90deg, #388e3c, #4CAF50);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .login-title {
      color: #fff;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-subtitle {
      color: rgba(255,255,255,0.45);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-label {
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .form-control {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      padding: 12px 16px;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.1);
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.25); }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #388e3c, #4CAF50);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(76,175,80,0.35);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 28px 0 20px;
    }

    .back-link {
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      transition: color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.7); }

    /* ── FIX: Hapus display:none dari CSS, atur via JS ── */
    #msg {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      text-align: center;
      margin-top: 12px;
      display: none; /* default disembunyikan lewat CSS saja */
    }
    #msg.error {
      background: rgba(255,80,80,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      color: #ff6b6b;
    }
    #msg.success {
      background: rgba(76,175,80,0.15);
      border: 1px solid rgba(76,175,80,0.3);
      color: #81c784;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="badge-super">⚡ Superadmin</div>
    <h1 class="login-title">Jualin Control</h1>
    <p class="login-subtitle">Masuk sebagai superadmin untuk mengelola semua toko</p>

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control"
             placeholder="Masukkan username" autocomplete="off">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control"
             placeholder="Masukkan password">
    </div>

    <div id="msg"></div>

    <button class="btn-login" id="btnLogin" onclick="doLogin()">
      🔐 Masuk sebagai Superadmin
    </button>

    <div class="divider"></div>
    <a href="login.html" class="back-link">
      ← Kembali ke Login Admin Toko
    </a>
  </div>

  <script>
    // ── Cek sesi aktif ──
    if (sessionStorage.getItem("superadmin_id")) {
      window.location.href = "superadmin_dashboard.html";
    }

    // ── Enter key support ──
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    // ── Helper tampilkan pesan (FIX: tidak pakai style.display) ──
    function showMsg(text, type = "error") {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = type;        // set class dulu
      msg.style.display = "block"; // baru set display
    }

    function hideMsg() {
      const msg = document.getElementById("msg");
      msg.style.display = "none";
      msg.className = "";
      msg.textContent = "";
    }

    // ── Fungsi Login ──
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("btnLogin");

      hideMsg();

      // Validasi field kosong
      if (!username || !password) {
        showMsg("⚠️ Username dan password wajib diisi");
        return;
      }

      // Loading state
      btn.disabled     = true;
      btn.textContent  = "⏳ Memproses...";

      try {
        // ── FIX PATH: 2 level ke atas dari Frontend/Tampilan_superadmin/ ──
        // Sesuaikan path ini jika struktur folder berbeda
        const res = await fetch("../../Backend/superadmin/superadmin_login.php", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ username, password })
        });

        // Cek apakah response bisa di-parse sebagai JSON
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          console.error("Response bukan JSON:", text);
          showMsg("⚠️ Response server tidak valid. Cek path PHP.");
          return;
        }

        if (data.status) {
          showMsg("✅ Login berhasil, mengalihkan...", "success");
          sessionStorage.setItem("superadmin_id",       data.id);
          sessionStorage.setItem("superadmin_username",  data.username);
          setTimeout(() => {
            window.location.href = "superadmin_dashboard.html";
          }, 800);
        } else {
          showMsg("❌ " + (data.message || "Username atau password salah"));
        }

      } catch (err) {
        console.error("Fetch error:", err);
        showMsg("⚠️ Tidak bisa terhubung ke server. Cek koneksi atau path file PHP.");
      } finally {
        btn.disabled    = false;
        btn.textContent = "🔐 Masuk sebagai Superadmin";
      }
    }
  </script>
</body>
</html>
