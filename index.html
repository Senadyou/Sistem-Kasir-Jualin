<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Masuk - Sistem Jualin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portal-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #2e7d32;
        }
        .portal-container h1 {
            color: #2e7d32;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .portal-container p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-main {
            background-color: #2e7d32;
            color: white;
        }
        .btn-main:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }
        .btn-admin {
            background-color: #333333;
            color: white;
        }
        .btn-admin:hover {
            background-color: #111111;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <h1>🛍️ Sistem Jualin</h1>
        <p>Selamat datang di Sistem Kasir dan Pencatatan Transaksi Penjualan. Silakan pilih portal masuk Anda:</p>
        
        <div class="button-group">
            <a href="Projek_jualin_v0.1/Frontend/login.html" class="btn btn-main">
                👤 Login Kasir / Owner
            </a>
            
            <a href="Projek_jualin_v0.1/Frontend/Tampilan_superadmin/login_superadmin.html" class="btn btn-admin">
                ⚙️ Login Superadmin
            </a>
        </div>
    </div>

</body>
</html>
